# Keep the running app's build id and version.json on the same commit.
# GitHub Pages publishes the main branch as-is, so the id has to be committed.
name: Stamp app version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stamp-app-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version.json and index.html
        run: python3 stamp_version.py "$GITHUB_SHA"
      - name: Commit the stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html
          if git diff --cached --quiet; then
            echo "version already matches ${GITHUB_SHA}"
            exit 0
          fi
          git commit -m "Stamp app version ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
